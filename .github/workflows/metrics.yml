name: Metrics

on:
  schedule:
    # Rebuild daily
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Generate metrics
        uses: lowlighter/metrics@latest
        with:
          # A classic PAT (scopes: repo, read:org, read:user) saved as the
          # repo secret METRICS_TOKEN. Required for the plugins below.
          token: ${{ secrets.METRICS_TOKEN }}
          user: Sravan-Gogineni
          filename: github-metrics.svg
          template: classic
          base: header, activity, repositories
          config_timezone: America/Phoenix
          # In-depth language analysis (clones repos — credible byte/line breakdown)
          plugin_languages: yes
          plugin_languages_indepth: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          # Isometric 3D contribution calendar
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          # Coding habits / time-of-day analytics
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
